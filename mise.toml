[settings]
# Keep tool resolution reproducible while allowing deliberate version-range updates.
lockfile = true
# Match the user's machine-wide delay for newly published tool versions.
minimum_release_age = "1d"

[tools]
rust = { version = "1.97.0", profile = "default", components = ["rustfmt", "clippy"] }
usage = "6.8.0"
python = "3.14.3"
node = "24.14.0"
# Runs the parity screenshot and performance scripts with their pinned Playwright.
uv = "0.13.3"
"npm:@fission-ai/openspec" = "1.6.0"
"npm:rulesync" = "9.6.3"
# Installs the git hooks that regenerate Rulesync output after a pull or checkout.
lefthook = "2.2.2"
"cargo:https://github.com/codekiln/clilint" = { version = "rev:200e92a5d76420e8c47fd9e623da704b355dbc7d", locked = true, crate = "clilint", bin = "clilint", install_env = { RUSTUP_TOOLCHAIN = "1.97.0" } }
release-plz = "0.3.169"
cargo-dist = "0.32.0"

# Install the lefthook git hooks when entering this repo. Idempotent.
[hooks]
enter = "lefthook install"
