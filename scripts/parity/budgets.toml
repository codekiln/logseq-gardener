# Performance budgets for every lsg fixture page. KB is 1,000 and MB is 1,000,000.
# parity:perf marks lsg values above these; parity:budgets checks the two size budgets in CI.

[desktop]
data_before_title_kb = 100
script_before_title_kb = 16
title_ms = 300
peak_heap_mb = 10
search_p95_ms = 50

[phone]
data_before_title_kb = 100
script_before_title_kb = 16
title_ms = 1500
peak_heap_mb = 10
search_p95_ms = 100

# The header and left sidebar on every lsg page (published-app-shell).
[shell]
script_kb = 6
frame_kb = 6

# The journals feed on the home page (published-journals). parity:budgets checks script_kb;
# parity:perf marks the phone heap after the feed has loaded ten batches, and build times
# with journals more than build_slowdown_pct above the build without them.
[journals]
script_kb = 4
scroll_heap_mb = 20
build_slowdown_pct = 20
