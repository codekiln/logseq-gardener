# Performance budgets for every lsg fixture page. KB is 1,000 and MB is 1,000,000.
# parity:perf marks lsg values above these; parity:budgets checks the size budgets in CI.

[desktop]
data_before_title_kb = 100
script_before_title_kb = 16
title_ms = 300
peak_heap_mb = 10
search_p95_ms = 50

[phone]
data_before_title_kb = 100
script_before_title_kb = 16
title_ms = 1500
peak_heap_mb = 10
search_p95_ms = 100

# The header and left sidebar on every lsg page (published-app-shell). frame_kb is the header
# and sidebar markup between <body> and <main>; the shell's styles are in lsg-site.css.
[shell]
# 6 before the right sidebar's loader, 6.5 before View as slides, 6.6 before Queries; the
# flashcards entry in the left sidebar and its loader took 0.3 more.
script_kb = 6.9
frame_kb = 6

# The journals feed on the home page (published-journals). parity:budgets checks script_kb;
# parity:perf marks the phone heap after the feed has loaded ten batches, and build times
# with journals more than build_slowdown_pct above the build without them.
[journals]
script_kb = 4
scroll_heap_mb = 20
build_slowdown_pct = 20

# Page outlines (published-page-outline). parity:budgets checks script_kb and the gzip size of
# the outline styles every page carries; parity:perf marks zoom times above zoom_ms.
[outline]
script_kb = 8
styles_gzip_kb = 1.5
zoom_ms_desktop = 50
zoom_ms_phone = 150

# Search format version 2 (match-logseq-search): a title index, word-prefix shards and record
# chunks. parity:budgets checks the title index, every shard and every chunk on the fixture garden;
# parity:perf --search-site marks the rest on the whole encode garden. Warm keystrokes, which fetch
# no shard, use the [desktop] and [phone] search_p95_ms.
[search]
bootstrap_kb = 2
titles_gzip_kb = 300
titles_decoded_mb = 1.5
shard_gzip_kb = 64
chunk_gzip_kb = 32
keystroke_gzip_kb = 200
dialog_ms_desktop = 100
dialog_ms_phone = 300
first_results_ms_desktop = 500
first_results_ms_phone = 2500
cold_keystroke_ms_desktop = 150
cold_keystroke_ms_phone = 1000
heap_growth_mb = 30
warm_open_desktop_ms = 100
warm_open_phone_ms = 200
build_slowdown_pct = 25

# Inline markup (published-inline-markup). parity:budgets checks the gzip size of the inline
# styles every page carries, and that the largest fixture page grows by at most
# largest_page_growth_kb over its gzip size before inline markup (7,479 bytes on 2026-10-25). 2 before
# the Flashcards sidebar item, which adds about 80 bytes of gzip to every page, and 2.1 before the
# shell's scroll-padding-top rule for fragment targets, which adds about 15.
[inline]
styles_gzip_kb = 1
largest_page_baseline_gzip_kb = 7.479
largest_page_growth_kb = 2.15

# Fenced code and tables (published-code-and-tables). parity:budgets checks the gzip size of the
# code and table styles every page carries, and that the largest fixture page with fenced code
# grows by at most page_growth_gzip_kb over its gzip size before highlighting (Tools/Code, 8,010
# bytes with lsg 78d6a56 on 2026-10-25). parity:perf --baseline-lsg marks a whole-garden build
# more than build_slowdown_pct slower than the baseline binary's.
[code]
styles_gzip_kb = 1.5
largest_page_baseline_gzip_kb = 8.010
page_growth_gzip_kb = 10
build_slowdown_pct = 20

# Block references and embeds (published-transclusion). parity:budgets checks the gzip size of the
# transclusion styles every page carries, and that some fixture page holds an embed well so the
# first-paint budget above covers embedded outlines.
[transclusion]
styles_gzip_kb = 1

# Pages tagged with, Linked References and Unlinked References (published-reference-sections).
# parity:budgets checks script_kb, styles_gzip_kb and every _refs/ file's size as stored (Linked and
# Unlinked References files are stored gzip-compressed); parity:perf
# marks the time to the first group after opening a section, a filter change on the desktop, the
# phone heap after opening both sections on mise and scrolling to the end, and a whole-garden build
# more than build_slowdown_pct slower than the --baseline-lsg binary's.
[references]
# 6 before the Hierarchy loader; [hierarchy] script_growth_kb allows 1 more.
script_kb = 7
styles_gzip_kb = 1
fragment_kb = 100
open_ms_desktop = 300
open_ms_phone = 1500
open_heap_mb = 20
filter_ms = 50
build_slowdown_pct = 25

# All pages (published-all-pages). parity:budgets checks the All pages first paint against the
# [desktop] and [phone] budgets, each static paging page's gzip size, first-page growth when the
# fixture garden gains 2,000 pages, the script and the list data file. parity:perf marks the
# list size on the whole garden, the phone heap after loading the list and sorting by Backlinks,
# search on Enter, and a whole-garden build more than build_slowdown_pct slower than the
# --baseline-lsg binary's.
[all_pages]
paging_page_gzip_kb = 10
growth_kb = 1
script_gzip_kb = 3
list_gzip_kb = 300
sort_heap_mb = 20
search_ms_desktop = 50
search_ms_phone = 150
build_slowdown_pct = 10

# The Hierarchy section (published-namespace-hierarchy). parity:budgets checks the rows in each
# page, the gzip size of the hierarchy styles every page carries, the growth of lsg-references.js
# over its size before the Hierarchy loader, each hierarchy fragment's gzip size, and that the root
# of a fixture namespace grown by 2,000 pages grows by at most root_growth_kb. parity:perf marks the
# phone heap after scrolling Microfreak's list to the end, and a whole-garden build more than
# build_slowdown_pct slower than the --baseline-lsg binary's.
[hierarchy]
inline_rows = 100
styles_gzip_kb = 0.5
script_baseline_kb = 5.995
script_growth_kb = 1
fragment_gzip_kb = 100
root_growth_kb = 1
scroll_heap_mb = 20
build_slowdown_pct = 10

# The right sidebar (published-right-sidebar). parity:budgets checks the gzip size of lsg-sidebar.js,
# that no fixture page requests it before use, and every fixture page's gzip size as a card's
# transfer. parity:perf --sidebar marks the Shift-click times, card transfers and the heap after
# thirteen cards on tmux in the whole encode garden.
[sidebar]
# 6 before the Slides card type, which needed 0.25 more.
script_gzip_kb = 6.5
card_ms_desktop = 300
card_ms_phone = 1500
card_fetch_gzip_kb = 60
ten_cards_heap_mb = 20

# The graph view and Page graph (published-graph-view, published-page-graph). parity:budgets checks
# the data file, the script with its styles, the worker and every neighbourhood file on the fixture
# garden, and that no other page loads graph data or the graph script; parity:perf --graph marks the
# rest on the whole encode garden. KB of scripts and styles are compacted gzip; the data files are
# stored gzip-compressed.
[graph]
data_gzip_kb = 600
script_kb = 30
worker_kb = 8
first_frame_ms_desktop = 1000
first_frame_ms_phone = 3000
heap_mb = 50
frame_ms_phone = 50
page_graph_fragment_gzip_kb = 100
page_graph_open_ms_desktop = 300
page_graph_open_ms_phone = 1500
build_slowdown_pct = 25

# View as slides (published-slides). parity:budgets checks the gzip size of lsg-slides.js, which
# carries its styles, and that no fixture page requests it before a Slides card renders.
# parity:perf --slides marks the rest on the AI Engineer Summit deck in the whole encode garden:
# choosing View as slides to the first slide, one step to the next slide drawn, and the JS heap
# growth after stepping through every slide, all on the desktop profile.
[slides]
script_gzip_kb = 6
open_ms_desktop = 300
step_ms_desktop = 50
deck_heap_mb = 10

# Video embeds and YouTube timestamps (published-media-embeds). parity:budgets checks media.js
# (uncompressed), media.css (gzip), the largest video placeholder's markup on the fixture garden, that
# only pages with a video load media.js and media.css, and that no fixture page's first paint holds an
# iframe or a third-party script. parity:perf --media counts third-party requests before a click on the
# whole encode garden. The timestamp page is measured on the whole encode garden with parity:build:
# its gzip size may grow by at most timestamp_page_growth_gzip_kb over the baseline from before the
# change.
[media]
script_kb = 3
styles_gzip_kb = 1
placeholder_kb = 0.6
timestamp_page = "Person/Gergely Orosz/Pod/26/09 Design Engineering with Maggie Appleton"
timestamp_page_baseline_gzip_kb = 73.931
timestamp_page_growth_gzip_kb = 20
third_party_requests_before_click = 0

# Queries (published-queries). parity:budgets checks lsg-queries.js (uncompressed) and
# lsg-queries.css (gzip), that only pages with a query box load them, each query box's in-page part
# and each query fragment file (gzip) on the fixture garden, and, through [desktop] and [phone], that
# the fixture's Tools/Queries page stays within the first-paint budgets and does not grow when the
# garden gains 2,000 pages. parity:perf marks opening the collapsed tmux query to its first group,
# the phone heap after all its fragments load, and a whole-garden build more than
# build_slowdown_pct slower than the --baseline-lsg binary's.
[queries]
script_kb = 2
styles_gzip_kb = 1
in_page_gzip_kb = 30
fragment_gzip_kb = 100
open_ms_desktop = 300
open_ms_phone = 1500
open_heap_mb = 20
build_slowdown_pct = 10

# Flashcards (published-flashcards). parity:budgets checks lsg-flashcards.js (uncompressed),
# lsg-flashcards.css, the all-cards deck file and every card batch (gzip), that no page links the
# review script (it loads on first use), and that the fixture deck page grows by at most
# deck_page_growth_gzip_kb over its gzip size without the deck widget. parity:perf --flashcards
# marks opening the review to its first card, the phone heap after scoring fifty cards, and a
# whole-garden build more than build_slowdown_pct slower than the --baseline-lsg binary's.
[flashcards]
script_kb = 8
styles_gzip_kb = 1.5
deck_gzip_kb = 8
card_batch_gzip_kb = 30
deck_page = "Tools/Flashcards"
deck_page_growth_gzip_kb = 4
open_ms_desktop = 300
open_ms_phone = 1500
review_heap_mb = 20
build_slowdown_pct = 10

# Loading Markdown from every garden folder (match-logseq-garden-markdown-files). No page's markup
# changes, so the [desktop] and [phone] rows cover first paint. parity:perf --baseline-lsg marks a
# whole-garden build more than build_slowdown_pct slower than the baseline binary's.
[loading]
build_slowdown_pct = 5

# Site plugins (published-plugin-host). parity:budgets builds the fixture garden with the recorder
# fixture plugin (tests/fixtures/plugins/recorder) and checks the host module's gzip size, every
# page's first paint against [desktop] and [phone], and that a build without plugins adds no
# plugin metadata or host reference to any page. parity:perf --plugins marks, on the whole encode
# garden with the same plugin, a same-document navigation from the response's arrival to the
# adopted page on the phone profile, and document and window listeners after 20 navigations
# above the count after the first.
[plugins]
host_gzip_kb = 4
added_bytes_per_page = 0
navigation_ms_phone = 50
listener_growth = 0

# Build plugins (build-time-contributions). parity:budgets builds the fixture garden with the
# episode-list fixture build plugin (tests/fixtures/plugins/episode-list) and checks the derived
# rows on each page (gzip of their markup), every page's first paint against [desktop] and [phone],
# and that every page without derived rows matches the build without plugins once the plugin
# metadata tags and the source anchors that block links need are left out. parity:build-bench builds a pinned commit of the encode garden
# without plugins and with each no-op fixture (in-process with blocks, process without and with
# blocks), and fails when the added build time per published page, the lsg process's peak memory
# growth with the process fixture and blocks, or any difference in output exceeds these.
[build_plugins]
derived_rows_gzip_kb = 30
in_process_blocks_ms_per_page = 0.05
process_pages_ms_per_page = 0.1
process_blocks_ms_per_page = 0.3
peak_memory_growth_pct = 15

# Site size (published-site-size). parity:publish-bench --check fails when the encode garden's
# whole site, its page HTML at the site root or its _refs/ directory exceeds site_mb, page_html_mb
# or refs_mb, measured on the files lsg publish writes with --journals, --search and every top-level
# namespace. parity:budgets fails on any inline <style> element the publisher writes and on a fixture
# page whose inline scripts, other than the dialogue and page-property start-ups, exceed
# inline_script_kb. parity:perf --baseline-lsg marks a whole encode garden build more than
# build_slowdown_pct slower than the baseline binary's. GitHub Pages serves at most 1 GB, and
# Logseq's gh-pages build of the same garden was 218 MB in 506 files on 2026-10-27.
[site]
site_mb = 550
page_html_mb = 200
refs_mb = 100
inline_script_kb = 1.5
build_slowdown_pct = 10

# Publication speed (publication-speed). parity:publish-bench --check compares the fastest warm
# build of each corpus with the rows recorded in docs/parity/publication-speed.json for the same
# corpus and runner. Rows on the same processor model allow slowdown_pct over the slowest of them:
# repeated GitHub runs on one model spread by about 6%. Without such a row, the slowest row allows
# unknown_cpu_slowdown_pct: GitHub's ubuntu-latest runners took 15.5 to 28.8 seconds for the
# same encode garden build in October 2026, depending on the machine.
[publication]
slowdown_pct = 20
unknown_cpu_slowdown_pct = 100
