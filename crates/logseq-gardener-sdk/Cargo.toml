[package]
name = "logseq-gardener-sdk"
version = "0.0.16"
edition = "2024"
rust-version = "1.97"
description = "Rust API for Logseq Gardener"
license = "AGPL-3.0-only"
repository = "https://github.com/codekiln/logseq-gardener"
publish = false

[dependencies]
# Find every page's unlinked mentions in one pass over the block text.
aho-corasick = "1.1.5"
# Read-only Markdown syntax and references; revision covered by parser comparison.
lsdoc = { git = "https://github.com/martinkoutecky/lsdoc", rev = "32e63ef095c711d6d9947257bf5fd07d540fa59d" }
# Match equivalent Unicode page names using this crate's NFC normalization.
unicode-normalization = "0.1.24"

# Measure gzip sizes so search shards split before they exceed their budget.
flate2 = "1.1.10"

# Serialize the versioned selected-source search contract as JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Highlight fenced code at build time with TextMate grammars and the pure-Rust regex engine.
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
# Grammars syntect lacks (TOML, TypeScript, Dockerfile and others the garden uses).
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[package.metadata.dist]
dist = false
