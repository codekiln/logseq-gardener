name: Vendor sources

# Called by the dist-generated release.yml through `global-artifacts-jobs` in
# dist-workspace.toml. The uploaded `artifacts-*` files are attached to the
# GitHub Release, and the release is not created if this job fails.

on:
  workflow_call:
    inputs:
      plan:
        description: dist plan manifest passed by release.yml
        required: true
        type: string

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive locked dependency sources
        run: .mise/tasks/release/vendor target/distrib
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-vendor-sources
          path: |
            target/distrib/*-vendor.tar.gz
            target/distrib/*-vendor.tar.gz.sha256
          if-no-files-found: error
